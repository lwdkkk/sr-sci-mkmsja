<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수리고등학교 과학과제연구 신기하조 디지털 실험실</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const concentrationData = [
            { time: 0, concentration: 100.0 },
            { time: 5, concentration: 96.8 },
            { time: 10, concentration: 88.3 },
            { time: 15, concentration: 75.1 },
            { time: 20, concentration: 61.4 },
            { time: 25, concentration: 48.7 },
            { time: 30, concentration: 36.2 },
            { time: 35, concentration: 25.5 },
            { time: 40, concentration: 16.8 },
            { time: 45, concentration: 10.3 },
            { time: 50, concentration: 5.7 },
            { time: 55, concentration: 2.4 },
            { time: 60, concentration: 0.9 },
            { time: 65, concentration: 0.3 },
            { time: 70, concentration: 0.1 },
            { time: 75, concentration: 0.0 }
        ];

        const getConcentrationAtTime = (time) => {
            if (time <= 0) return 100.0;
            if (time >= 75) return 0.0;

            const lowerData = concentrationData.slice().reverse().find(d => d.time <= time);
            const upperData = concentrationData.find(d => d.time > time);

            if (!upperData) return lowerData.concentration;

            const timeDiff = upperData.time - lowerData.time;
            const concDiff = upperData.concentration - lowerData.concentration;
            const timeRatio = (time - lowerData.time) / timeDiff;

            return lowerData.concentration + (concDiff * timeRatio);
        };

        function App() {
            const [currentScreen, setCurrentScreen] = useState('home');

            if (currentScreen === 'home') {
                return <HomeScreen onNavigate={setCurrentScreen} />;
            }

            return <DigitalExperiment onNavigate={() => setCurrentScreen('home')} />;
        }

        function HomeScreen({ onNavigate }) {
            return (
                <div className="min-h-screen bg-green-50 flex flex-col items-center justify-center p-8 font-sans">
                    <div className="absolute top-6 right-6">
                        <a 
                            href="https://forms.gle/MFSiFMmPwDr6f9Qw9" 
                            target="_blank" 
                            rel="noreferrer"
                            className="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-full font-bold shadow-md transition-colors"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                            </svg>
                            피드백 제공
                        </a>
                    </div>

                    <div className="text-center mb-12">
                        <h2 className="text-xl text-green-700 font-bold mb-2 tracking-widest">수리고등학교 과학과제연구 신기하조</h2>
                        <h1 className="text-5xl font-extrabold text-green-900 mb-6 drop-shadow-sm">디지털 실험실</h1>
                        <p className="text-lg text-green-800 bg-green-100 py-2 px-6 rounded-full inline-block font-medium">
                            산화환원 원리를 이용한 펜의 기화 과정 실험
                        </p>
                    </div>

                    <div className="w-full max-w-xl">
                        <div 
                            onClick={() => onNavigate('digital')}
                            className="bg-white border-[3px] border-green-200 rounded-3xl p-10 cursor-pointer hover:border-green-500 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 group"
                        >
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-3xl font-bold text-green-800">디지털 실험</h3>
                                <svg className="w-10 h-10 text-green-400 group-hover:text-green-600 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M5 12h14M12 5l7 7-7 7"/>
                                </svg>
                            </div>
                            <p className="text-gray-600 text-lg">펜의 기화 과정을 화면에서 직접 체험해보고 데이터를 도식화할 수 있는 실험실</p>
                        </div>
                    </div>
                </div>
            );
        }

        function DigitalExperiment({ onNavigate }) {
            const [intervalTime, setIntervalTime] = useState(5);
            const [isSimulating, setIsSimulating] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [paths, setPaths] = useState([]);
            const [currentPath, setCurrentPath] = useState(null);
            
            const [collectedData, setCollectedData] = useState([]);
            const [userPoints, setUserPoints] = useState([]);
            const [showOverlay, setShowOverlay] = useState(false);
            
            const [maxX, setMaxX] = useState(70);
            const [stepX, setStepX] = useState(10);
            const [stepY, setStepY] = useState(10);

            // 다른 화면으로 넘어갈 때 혹시라도 스크롤이 잠겨있으면 풀어주는 안전장치
            useEffect(() => {
                return () => {
                    document.body.style.overflow = '';
                    document.body.style.touchAction = '';
                };
            }, []);

            const startDrawing = (e) => {
                if (isSimulating || currentTime > 0) return;
                
                // [핵심 해결 방법] 그리기 시작할 때 화면 전체의 스크롤을 강제로 잠금
                document.body.style.overflow = 'hidden';
                document.body.style.touchAction = 'none';

                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                setIsDrawing(true);
                setCurrentPath({ points: [{ x, y }] });
            };

            const draw = (e) => {
                if (!isDrawing || !currentPath) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                setCurrentPath(prev => ({
                    ...prev,
                    points: [...prev.points, { x, y }]
                }));
            };

            const stopDrawing = () => {
                // 그리기 끝나면 화면 전체 스크롤 잠금 해제
                document.body.style.overflow = '';
                document.body.style.touchAction = '';

                if (!isDrawing) return;
                setIsDrawing(false);
                if (currentPath && currentPath.points.length > 0) {
                    setPaths(prev => [...prev, currentPath]);
                }
                setCurrentPath(null);
            };

            const clearCanvas = () => {
                setPaths([]);
                setCurrentPath(null);
                setCurrentTime(0);
                setCollectedData([]);
                setUserPoints([]);
                setShowOverlay(false);
                setIsSimulating(false);
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const currentConcentration = getConcentrationAtTime(currentTime);
                const opacity = currentConcentration / 100;
                
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 4;
                
                const allPaths = currentPath ? [...paths, currentPath] : paths;
                
                allPaths.forEach(path => {
                    if (path.points.length === 0) return;
                    
                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(30, 64, 175, ${opacity})`;
                    
                    ctx.moveTo(path.points[0].x, path.points[0].y);
                    for (let i = 1; i < path.points.length; i++) {
                        ctx.lineTo(path.points[i].x, path.points[i].y);
                    }
                    ctx.stroke();
                });
            }, [paths, currentPath, currentTime]);

            const startSimulation = () => {
                if (paths.length === 0) {
                    alert("먼저 캔버스에 그림을 그려주세요!");
                    return;
                }
                if (intervalTime <= 0) {
                    alert("측정 간격은 0보다 커야 합니다.");
                    return;
                }
                
                setCollectedData([]);
                setCurrentTime(0);
                setIsSimulating(true);
            };

            useEffect(() => {
                let timer;
                if (isSimulating) {
                    timer = setInterval(() => {
                        setCurrentTime(prev => {
                            const nextTime = prev + Number(intervalTime);
                            if (nextTime >= 75) {
                                setIsSimulating(false);
                                return 75;
                            }
                            return nextTime;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [isSimulating, intervalTime]);

            useEffect(() => {
                if (currentTime >= 0 && (isSimulating || currentTime === 75)) {
                    const conc = getConcentrationAtTime(currentTime);
                    const s = conc;
                    const v = 100 - ((100 - conc) * 0.2);
                    
                    setCollectedData(prev => {
                        if (prev.some(d => d.time === currentTime)) return prev;
                        return [...prev, {
                            time: currentTime,
                            s: s.toFixed(2),
                            v: v.toFixed(2),
                            concentration: conc.toFixed(2)
                        }];
                    });
                }
            }, [currentTime, isSimulating]);

            const handleGraphClick = (e) => {
                const rect = e.currentTarget.getBoundingClientRect();

                if (!rect.width || !rect.height || !Number.isFinite(maxX) || maxX <= 0) return;

                const xRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                const yRatio = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

                const timeValue = xRatio * maxX;
                const concValue = (1 - yRatio) * 100;

                setUserPoints(prev => [...prev, { x: timeValue, y: concValue }]);
            };

            return (
                <div className="min-h-screen bg-white p-6 font-sans text-gray-800">
                    <header className="flex items-center border-b-2 border-green-600 pb-4 mb-6">
                        <button onClick={onNavigate} className="text-green-700 font-bold flex items-center hover:text-green-900 cursor-pointer">
                            <svg className="w-5 h-5 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" />
                            </svg>
                            돌아가기
                        </button>
                        <h1 className="flex-1 text-center text-xl font-bold text-gray-700">수리고등학교 과학과제연구 신기하조 디지털 실험실</h1>
                    </header>

                    <div className="flex items-center gap-2 mb-6">
                        <div className="w-6 h-6 bg-green-700 text-white rounded-full flex items-center justify-center font-bold text-sm">D</div>
                        <h2 className="text-2xl font-black text-green-900">디지털 실험 <span className="text-green-600 font-medium text-lg ml-2">Digital Experiment</span></h2>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="space-y-8">
                            <section className="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-sm">
                                <h3 className="text-lg font-bold text-green-800 mb-2">1. 종이에 기화펜으로 그리기</h3>
                                <p className="text-sm text-gray-500 mb-4">마우스나 손가락으로 그림을 그린 뒤 [측정 시작]을 누르세요.</p>
                                
                                <div 
                                    className="bg-white border-2 border-dashed border-gray-300 rounded-lg overflow-hidden flex justify-center mb-4"
                                    style={{ touchAction: 'none' }} // 캔버스 주변 영역 터치도 막음
                                >
                                    <canvas
                                        ref={canvasRef}
                                        width={500}
                                        height={300}
                                        style={{ touchAction: 'none' }}
                                        className={`bg-white touch-none ${isSimulating ? 'cursor-not-allowed' : 'cursor-crosshair'}`}
                                        onMouseDown={startDrawing}
                                        onMouseMove={draw}
                                        onMouseUp={stopDrawing}
                                        onMouseLeave={stopDrawing}
                                        onTouchStart={(e) => { startDrawing(e.touches[0]); }}
                                        onTouchMove={(e) => { draw(e.touches[0]); }}
                                        onTouchEnd={stopDrawing}
                                        onTouchCancel={stopDrawing}
                                    />
                                </div>
                                
                                <div className="flex justify-end gap-2">
                                    <button 
                                        onClick={clearCanvas} 
                                        disabled={isSimulating}
                                        className="px-4 py-2 bg-gray-200 text-gray-700 rounded font-bold hover:bg-gray-300 disabled:opacity-50 cursor-pointer"
                                    >
                                        다시 그리기
                                    </button>
                                </div>
                            </section>

                            <section className="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-sm">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-green-800">2. 데이터 수집 (자동)</h3>
                                    <div className="flex items-center gap-3">
                                        <div className="flex items-center bg-white border border-gray-300 rounded px-2 py-1">
                                            <span className="text-sm text-gray-600 mr-2">측정 간격</span>
                                            <input 
                                                type="number" 
                                                value={intervalTime}
                                                onChange={(e) => setIntervalTime(e.target.value)}
                                                className="w-12 text-center font-bold outline-none"
                                                min="1"
                                                disabled={isSimulating || currentTime > 0}
                                            />
                                            <span className="text-sm text-gray-600 ml-1">분</span>
                                        </div>
                                        <button 
                                            onClick={startSimulation}
                                            disabled={isSimulating || currentTime > 0 || paths.length === 0}
                                            className="px-5 py-2 bg-green-600 text-white rounded font-bold hover:bg-green-700 disabled:opacity-50 cursor-pointer"
                                        >
                                            {isSimulating ? '측정 중...' : '측정 시작'}
                                        </button>
                                    </div>
                                </div>

                                <div className="overflow-y-auto max-h-60 border border-gray-300 bg-white rounded">
                                    <table className="w-full text-center text-sm">
                                        <thead className="bg-gray-100 sticky top-0">
                                            <tr>
                                                <th className="py-2 border-b border-gray-300">시간(분)</th>
                                                <th className="py-2 border-b border-gray-300 border-l">채도 S</th>
                                                <th className="py-2 border-b border-gray-300 border-l">명도 V</th>
                                                <th className="py-2 border-b border-gray-300 border-l text-green-700 font-bold">농도 지수(%)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {collectedData.length === 0 ? (
                                                <tr>
                                                    <td colSpan="4" className="py-8 text-gray-400">데이터가 없습니다. 측정 시작을 눌러주세요.</td>
                                                </tr>
                                            ) : (
                                                collectedData.map((data, idx) => (
                                                    <tr key={idx} className="border-b border-gray-100 hover:bg-green-50">
                                                        <td className="py-2">{data.time}</td>
                                                        <td className="py-2 border-l border-gray-100">{data.s}</td>
                                                        <td className="py-2 border-l border-gray-100">{data.v}</td>
                                                        <td className="py-2 border-l border-gray-100 font-bold text-green-600">{data.concentration}</td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </section>
                        </div>

                        <section className="bg-gray-50 p-6 rounded-xl border border-gray-200 shadow-sm flex flex-col">
                            <h3 className="text-lg font-bold text-green-800 mb-2">3. 그래프로 표현</h3>
                            <p className="text-sm text-gray-600 mb-4 bg-white p-3 rounded border border-green-100">
                                표의 값을 보고 X축·Y축 범위와 눈금 간격을 직접 정한 뒤, 그래프 위를 클릭하여 점을 찍으면 선으로 이어집니다.
                            </p>

                            <div className="flex gap-4 mb-4 bg-white p-3 rounded border border-gray-200">
                                <label className="flex items-center text-sm font-bold">
                                    X축 최댓값
                                    <input type="number" value={maxX} onChange={e=>setMaxX(Number(e.target.value))} className="ml-2 w-16 border rounded p-1 text-center" />
                                    <span className="ml-1 text-gray-500 font-normal">분</span>
                                </label>
                                <label className="flex items-center text-sm font-bold">
                                    X축 눈금 간격
                                    <input type="number" value={stepX} onChange={e=>setStepX(Number(e.target.value))} className="ml-2 w-16 border rounded p-1 text-center" />
                                </label>
                                <label className="flex items-center text-sm font-bold">
                                    Y축 눈금 간격
                                    <input type="number" value={stepY} onChange={e=>setStepY(Number(e.target.value))} className="ml-2 w-16 border rounded p-1 text-center" />
                                    <span className="ml-1 text-gray-500 font-normal">%</span>
                                </label>
                            </div>

                            <div className="relative flex-1 bg-white border-2 border-gray-400 ml-12 mb-8 min-h-[400px]">
                                <div className="absolute -left-12 top-0 bottom-0 flex flex-col justify-between text-xs text-gray-600 font-medium py-1">
                                    {[...Array(Math.floor(100/stepY) + 1)].map((_, i) => (
                                        <span key={i} className="absolute right-2" style={{ bottom: `${(i * stepY)}%`, transform: 'translateY(50%)' }}>
                                            {i * stepY}
                                        </span>
                                    ))}
                                    <span className="absolute -left-6 top-1/2 -rotate-90 origin-center text-gray-800 font-bold w-24 text-center" style={{ transform: 'translateY(-50%) rotate(90deg)'}}>농도 지수(%)</span>
                                </div>

                                <div className="absolute left-0 right-0 -bottom-8 flex justify-between text-xs text-gray-600 font-medium px-1">
                                    {[...Array(Math.floor(maxX/stepX) + 1)].map((_, i) => (
                                        <span key={i} className="absolute top-2" style={{ left: `${(i * stepX / maxX) * 100}%`, transform: 'translateX(-50%)' }}>
                                            {i * stepX}
                                        </span>
                                    ))}
                                    <span className="absolute top-8 left-1/2 transform -translate-x-1/2 text-gray-800 font-bold">시간(분)</span>
                                </div>

                                <div className="absolute inset-0 pointer-events-none opacity-20">
                                    {[...Array(Math.floor(maxX/stepX) + 1)].map((_, i) => (
                                        <div key={`v-${i}`} className="absolute top-0 bottom-0 border-l border-gray-400" style={{ left: `${(i * stepX / maxX) * 100}%` }}></div>
                                    ))}
                                    {[...Array(Math.floor(100/stepY) + 1)].map((_, i) => (
                                        <div key={`h-${i}`} className="absolute left-0 right-0 border-t border-gray-400" style={{ bottom: `${(i * stepY)}%` }}></div>
                                    ))}
                                </div>

                                <svg 
                                    className="absolute inset-0 w-full h-full cursor-crosshair z-10" 
                                    onClick={handleGraphClick}
                                    viewBox="0 0 100 100" 
                                    preserveAspectRatio="none"
                                >
                                    {showOverlay && collectedData.length > 0 && (
                                        <polyline 
                                            points={collectedData.map(d => `${(d.time / maxX) * 100},${100 - d.concentration}`).join(' ')}
                                            fill="none" 
                                            stroke="rgba(34, 197, 94, 0.4)" 
                                            strokeWidth="2" 
                                            vectorEffect="non-scaling-stroke" 
                                        />
                                    )}
                                    {showOverlay && collectedData.map((d, i) => (
                                        <circle 
                                            key={`ans-${i}`} 
                                            cx={(d.time / maxX) * 100} 
                                            cy={100 - d.concentration} 
                                            r="1.5" 
                                            fill="rgb(21, 128, 61)" 
                                            vectorEffect="non-scaling-stroke"
                                        />
                                    ))}

                                    {userPoints.length > 1 && (
                                        <polyline 
                                            points={userPoints.map(p => `${(p.x / maxX) * 100},${100 - p.y}`).join(' ')}
                                            fill="none" 
                                            stroke="black" 
                                            strokeWidth="1.5" 
                                            vectorEffect="non-scaling-stroke" 
                                        />
                                    )}
                                    {userPoints.map((p, i) => (
                                        <circle 
                                            key={i} 
                                            cx={(p.x / maxX) * 100} 
                                            cy={100 - p.y} 
                                            r="1.5" 
                                            fill="black" 
                                            vectorEffect="non-scaling-stroke"
                                        />
                                    ))}
                                </svg>
                            </div>

                            <div className="flex justify-between items-center mt-auto">
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setUserPoints(prev => prev.slice(0, -1))}
                                        className="px-4 py-2 border border-gray-400 rounded bg-white hover:bg-gray-100 font-bold text-sm cursor-pointer"
                                    >
                                        마지막 점 지우기
                                    </button>
                                    <button 
                                        onClick={() => setUserPoints([])}
                                        className="px-4 py-2 border border-gray-400 rounded bg-white hover:bg-gray-100 font-bold text-sm cursor-pointer"
                                    >
                                        점 모두 지우기
                                    </button>
                                </div>
                                <button 
                                    onClick={() => setShowOverlay(!showOverlay)}
                                    className={`px-5 py-2 rounded font-bold text-sm text-white transition-colors cursor-pointer ${showOverlay ? 'bg-green-800' : 'bg-green-700 hover:bg-green-800'}`}
                                >
                                    {showOverlay ? '측정값 숨기기' : '측정값 겹쳐 보기'}
                                </button>
                            </div>
                        </section>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
